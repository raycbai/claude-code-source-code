name: Credential check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-check:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install checksum-pinned scanner
        run: python3 security/install_gitleaks.py
      - name: Scan selected Git data
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 security/scan.py --tree
            exit
          fi
          head_sha="$(git rev-parse HEAD)"
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            if git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
              BASE_SHA="$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH")"
            fi
            if [[ -z "$BASE_SHA" || "$BASE_SHA" == "$head_sha" || "$BASE_SHA" =~ ^0+$ ]]; then
              python3 security/scan.py --tree
              exit
            fi
          fi
          python3 security/scan.py --range "$BASE_SHA..$head_sha"
